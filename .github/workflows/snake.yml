name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar el snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=0066FF&color_dots=#ebedf0,#c6dcff,#89b8ff,#3d8bff,#0066FF
            dist/github-snake-dark.svg?color_snake=0066FF&color_dots=#161b22,#0b2e63,#0d47a1,#1565d8,#4d94ff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
