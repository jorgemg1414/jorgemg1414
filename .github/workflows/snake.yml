name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=0066FF&color_dots=#ebedf0,#c6dcff,#89b8ff,#3d8bff,#0066FF
            dist/github-snake-dark.svg?color_snake=0066FF&color_dots=#161b22,#0b2e63,#0d47a1,#1565d8,#4d94ff

      # PROFILE_TOKEN es un PAT con scope repo: sin el, la tarjeta sale
      # con solo los repos publicos en vez de fallar.
      - name: Generar la tarjeta de lenguajes
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 assets/gen_langs.py dist/langs.svg

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
